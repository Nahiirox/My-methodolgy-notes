$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Nahiirox Docs
  structure:
    - type: section
      key: section-1
      title: Nahiirox Docs
      path: nahiirox-docs
      default: true
      children:
        - type: space
          key: space-1
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./nahiirox-docs/documentation
        - type: space
          key: space-2
          title: Imported content
          path: imported-content
          draft: true
          content:
            directory: ./nahiirox-docs/imported-content
    - type: section
      key: section-2
      title: Product Docs
      path: product-docs
      children:
        - type: space
          key: space-3
          title: Product Docs
          path: product-docs
          default: true
          draft: true
          content:
            directory: ./product-docs
    - type: section
      key: section-3
      title: Imported content
      path: imported-content
      children:
        - type: space
          key: space-4
          title: Imported content
          path: imported-content
          default: true
          draft: true
          content:
            directory: ./imported-content
    - type: section
      key: section-4
      title: Imported content
      path: imported-content-1
      children:
        - type: space
          key: space-5
          title: Imported content
          path: imported-content
          default: true
          draft: true
          content:
            directory: ./imported-content-1/imported-content
    - type: section
      key: section-5
      title: Imported content
      path: imported-content-2
      children:
        - type: space
          key: space-6
          title: Imported content
          path: imported-content
          default: true
          draft: true
          content:
            directory: ./imported-content-1/imported-content
